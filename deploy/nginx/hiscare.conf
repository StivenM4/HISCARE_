# ==============================================================================
# HISCARE - Configuración de Nginx y Web Hardening
# Sistema de Información Hospitalaria (IPS)
# Arquitectura: Proxy Inverso hacia aplicación Node.js (Express)
# Cumplimiento: HIS-NF-02, HIS-NF-10, HIS-E-12, OWASP Top 10, Pantalla C.27
# ==============================================================================

# ------------------------------------------------------------------------------
# Mapeo para actualización de conexiones WebSockets (RFC 6455)
# ------------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------------------
# 1. Redirección HTTP a HTTPS (Puerto 80)
# Obliga a todo el tráfico a utilizar un canal seguro cifrado en tránsito (HIS-NF-02)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirección permanente 301 preservando host y URI solicitada
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 2. Servidor Seguro HTTPS (Puerto 443)
# Protocolo TLS 1.3 estricto, HTTP/2, Ciphers seguros y Cabeceras de Protección
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # Ocultar la versión de Nginx para evitar fingerprinting (Hardening / HIS-E-12)
    server_tokens off;

    # --------------------------------------------------------------------------
    # Parámetros y Certificados SSL / TLS
    # --------------------------------------------------------------------------
    ssl_certificate     /etc/ssl/certs/hiscare.crt;
    ssl_certificate_key /etc/ssl/private/hiscare.key;

    # Estrictamente TLS 1.3 (Requisito UAT C.27: TLSv1.2 y anteriores rechazados)
    ssl_protocols TLSv1.3;

    # Suites de cifrado recomendadas y seguras para TLS 1.3 (RFC 8446)
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
    ssl_prefer_server_ciphers off;

    # Optimización de caché de sesiones SSL/TLS (rendimiento y reducción de latencia)
    ssl_session_cache shared:SSL_HISCARE:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Curvas elípticas seguras para intercambio de llaves Diffie-Hellman
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    # --------------------------------------------------------------------------
    # 3. Cabeceras de seguridad estrictas (HIS-NF-02, HIS-NF-10, OWASP)
    # --------------------------------------------------------------------------
    # HSTS: Fuerza el uso de HTTPS por 1 año e incluye todos los subdominios
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP: Restricción estricta de fuentes de scripts, estilos, fuentes e imágenes
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self';" always;

    # Anti-Clickjacking: Permite la inclusión en frames únicamente desde el mismo origen (SAMEORIGIN)
    # para compatibilidad con el visor clínico C.25 (iframePreviewAdjunto en visor.ejs) y alineación con Helmet
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Anti-Sniffing: Impide que los clientes ignoren el Content-Type declarado
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer-Policy: Evita la fuga de URLs y parámetros sensibles hacia dominios externos
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy: Restringe el acceso a periféricos y APIs del navegador
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Desactivar filtro XSS heredado del navegador en favor de la directiva CSP moderna
    add_header X-XSS-Protection "0" always;

    # --------------------------------------------------------------------------
    # Límites de cuerpo de peticiones (Protección contra DoS / Cargas de archivos C.25)
    # Relación con MAX_UPLOAD_MB (10 MB en src/middlewares/upload.js):
    # Se fija client_max_body_size en 25M para permitir holgadamente cargas multipart
    # de adjuntos clínicos de hasta 10 MB (HIS-F-29 / HIS-E-08) junto con metadatos del
    # formulario y delimitadores HTTP sin que Nginx aborte con 413 Payload Too Large
    # prematuro, permitiendo a Express/Multer responder con validaciones controladas y auditoría.
    # --------------------------------------------------------------------------
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # --------------------------------------------------------------------------
    # 5. Manejo de errores 502, 503, 504 con página estática
    # Validación 9: La página 503 estática no depende de Node.js ni de la base de datos
    # --------------------------------------------------------------------------
    error_page 502 503 504 /503.html;

    location = /503.html {
        root /var/www/hiscare/public;
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # --------------------------------------------------------------------------
    # 6. Servir estáticos directamente desde Nginx (Optimización de rendimiento)
    # Reduce carga sobre Node.js sirviendo assets precompilados y cacheados
    # --------------------------------------------------------------------------
    location /public/ {
        alias /var/www/hiscare/public/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # --------------------------------------------------------------------------
    # PROTECCIÓN DE ARCHIVOS CLÍNICOS Y ADJUNTOS (/uploads) - HARDENING RBAC
    # IMPORTANTE (HIS-NF-02, HIS-NF-10, Pantalla C.25 / RBAC):
    # NUNCA definir una directiva 'location /uploads/' con alias o root estático en Nginx.
    # Servir /uploads estáticamente eludiría la autenticación y autorización clínica.
    # Toda petición hacia /uploads/* (resultados de laboratorio, imágenes diagnósticas)
    # DEBE canalizarse a través del proxy inverso hacia Node.js/Express (location /),
    # donde se ejecutan de manera obligatoria los middlewares:
    #   1. sesion                    -> Verifica autenticación activa del usuario.
    #   2. autorizar('resultados','L') -> Valida permisos RBAC según matriz de roles.
    #   3. auditoriaUploads          -> Registra trazabilidad de acceso a datos clínicos.
    # --------------------------------------------------------------------------

    # --------------------------------------------------------------------------
    # 7. Endpoint de Health Check
    # Monitoreo de uptime y disponibilidad del servicio para SRE y Load Balancers
    # --------------------------------------------------------------------------
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log off;
    }

    # --------------------------------------------------------------------------
    # 4. Proxy inverso hacia la aplicación Node.js
    # Reenvío de tráfico dinámico y manejo de WebSockets
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Cabeceras de reenvío de identidad de red (requerido para app.set('trust proxy', 1))
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para WebSockets / upgrade de protocolo
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts de proxy resilientes
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering de respuestas para alto rendimiento
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
