<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servicio no disponible · HISCARE</title>
  <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
  <style>
    :root {
      --hiscare-body-bg: #f8fafc;
      --hiscare-card-bg: #ffffff;
      --hiscare-text-main: #1e293b;
      --hiscare-text-muted: #64748b;
      --hiscare-primary: #0d6efd;
    }
    body {
      background-color: #f8fafc;
      color: #1e293b;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card-503 {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      border-radius: 0.75rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      text-align: center;
      box-sizing: border-box;
    }
    .code-503 {
      font-size: 3.5rem;
      font-weight: 700;
      color: #4a5568;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .title-503 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1e293b;
      margin-top: 0;
      margin-bottom: 0.75rem;
    }
    .desc-503 {
      color: #64748b;
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }
    .alert-503 {
      background-color: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
      border-radius: 0.375rem;
      padding: 0.6rem 0.85rem;
      font-size: 0.85rem;
      text-align: left;
      margin-bottom: 1.25rem;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.9rem;
      text-align: left;
    }
    .meta-label {
      color: #64748b;
    }
    .meta-val-code {
      font-family: monospace;
      color: #0d6efd;
      font-weight: 700;
      font-size: 0.95rem;
    }
    .meta-val-timer {
      color: #1e293b;
      font-weight: 500;
    }
    .btn-retry {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 0.65rem 1rem;
      margin-top: 1.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #0d6efd;
      background-color: transparent;
      border: 1px solid #0d6efd;
      border-radius: 0.375rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease-in-out;
    }
    .btn-retry:hover {
      background-color: #0d6efd;
      color: #ffffff;
    }
  </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="card card-503 p-4 p-sm-5 shadow-sm border-0 rounded-3 text-center" style="max-width: 480px; width: 100%;">
    <!-- 27.24: Número 503 en gris pizarra oscuro -->
    <div class="display-3 fw-bold text-secondary mb-1 code-503" style="color: #4a5568 !important;" data-trace="C27-24">503</div>

    <!-- 27.25: Título Servicio no disponible temporalmente -->
    <h1 class="h4 fw-bold text-dark mb-2 title-503" data-trace="C27-25">Servicio no disponible temporalmente</h1>

    <!-- 27.26: Mensaje de tranquilidad sobre datos salvados -->
    <p class="text-secondary mb-3 desc-503" data-trace="C27-26">HISCARE no puede atender la solicitud en este momento. Los datos que ya fueron confirmados están a salvo.</p>

    <!-- 27.27: Alerta amarilla sin detalles técnicos -->
    <div class="alert alert-warning text-start py-2 px-3 small mb-3 alert-503" role="status" data-trace="C27-27">
      ⚠ No se muestran detalles técnicos del error al usuario.
    </div>

    <!-- Metadatos de incidente y reintento -->
    <div class="text-start mb-4">
      <!-- 27.28, 27.29: Código de incidente -->
      <div class="d-flex justify-content-between py-1 border-bottom meta-row">
        <span class="text-muted meta-label" data-trace="C27-28">Código de incidente</span>
        <code class="text-primary fw-bold meta-val-code" id="codigoIncidente" data-trace="C27-29">INC-OFFLINE</code>
      </div>

      <!-- 27.30, 27.31: Siguiente intento con cuenta regresiva -->
      <div class="d-flex justify-content-between py-1 border-bottom meta-row">
        <span class="text-muted meta-label" data-trace="C27-30">Siguiente intento</span>
        <span class="text-dark fw-medium meta-val-timer" data-trace="C27-31">Automático en <span id="contador-segundos">30</span> s</span>
      </div>
    </div>

    <!-- 27.32: Botón Reintentar ahora -->
    <button type="button" class="btn btn-outline-primary btn-retry w-100 py-2 fw-semibold" onclick="location.reload()" data-trace="C27-32">Reintentar ahora</button>
  </div>

  <script>
    (function () {
      try {
        const d = new Date();
        const fechaStr = d.toISOString().slice(0, 10).replace(/-/g, '');
        const rand = Math.random().toString(36).slice(2, 6).toUpperCase();
        const elInc = document.getElementById('codigoIncidente');
        if (elInc) elInc.textContent = 'INC-' + fechaStr + '-' + rand;
      } catch (e) {}

      let segundos = 30;
      const el = document.getElementById('contador-segundos');
      const intervalo = setInterval(function () {
        segundos--;
        if (el) el.textContent = segundos;
        if (segundos <= 0) {
          clearInterval(intervalo);
          location.reload();
        }
      }, 1000);
    })();
  </script>
</body>
</html>
